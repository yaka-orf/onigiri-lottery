<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- 背景(薄い水色・角丸) -->
  <rect width="128" height="128" rx="28" fill="#ddeef5"/>
  <!-- おにぎり本体: やや横広の三角形・角を軽く丸める -->
  <path d="M64 16
           Q 68 16 71 21
           L 101 84
           Q 104 90 98 90
           L 30 90
           Q 24 90 27 84
           L 57 21
           Q 60 16 64 16 Z"
        fill="#ffffff"/>
  <!-- 海苔: 底辺全幅・下端は本体の底辺と同一直線 -->
  <path d="M30 70
           L 98 70
           L 98 90
           L 30 90
           Z"
        fill="#1f3a2e"/>
  <!-- 海苔の上端ライン -->
  <rect x="30" y="70" width="68" height="4" fill="#162c23"/>
</svg>
